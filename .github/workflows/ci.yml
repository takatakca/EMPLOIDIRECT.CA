name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Docker image
        run: docker build --tag emploidirect:ci .

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_only_not_for_production
          POSTGRES_DB: emploidirect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emploidirect_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Exercise real PostgreSQL transactions and retention
        run: node --test tests/postgres-integration.test.js
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci_ephemeral_only_not_for_production@127.0.0.1:5432/emploidirect_ci
